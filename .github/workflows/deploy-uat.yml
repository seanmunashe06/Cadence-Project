name: Deploy UAT

on:
  push:
    branches:
      - uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - run: docker build -t ${{ secrets.DOCKER_USERNAME }}/cadence-performance-platform:uat .
      - run: docker push ${{ secrets.DOCKER_USERNAME }}/cadence-performance-platform:uat
      - run: kubectl apply -f k8s/uat/